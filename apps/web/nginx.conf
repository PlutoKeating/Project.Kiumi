server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:8787;
    proxy_set_header Host $host;
    client_max_body_size 32m;
  }
  location /assets/ {
    proxy_pass http://server:8787;
  }
  location /uploads/ {
    proxy_pass http://server:8787;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
