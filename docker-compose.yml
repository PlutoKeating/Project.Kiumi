services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      KIUMI_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8787"
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    volumes:
      - ./data:/data
    ports:
      - "8787:8787"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - server
    ports:
      - "5180:80"
    restart: unless-stopped
